name: Build

on:
  push:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Show latest Jetpack XR and AGP versions
        run: |
          for a in xr/runtime/runtime xr/scenecore/scenecore xr/arcore/arcore xr/compose/compose; do
            g=$(dirname $a); n=$(basename $a)
            echo "androidx.$g:$n -> $(curl -s https://dl.google.com/android/maven2/androidx/$g/$n/maven-metadata.xml | grep -oE '<version>[^<]+' | sed 's/<version>//' | tail -5 | tr '\n' ' ')"
          done
          echo "AGP -> $(curl -s https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -oE '<version>8\.[0-9]+\.[0-9]+</version>' | tail -3 | tr '\n' ' ')"
      - name: Core engine tests
        run: ./gradlew :core:test --console=plain
      - name: Build the Android XR app (debug APK)
        run: ./gradlew :android:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: gbxr-debug-apk
          path: android/build/outputs/apk/debug/*.apk
